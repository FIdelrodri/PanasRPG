<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FatRPG · Registrarse</title>
  <link rel="stylesheet" href="inicio.css">
</head>
<body>
  <script src="../../../../PanasRPG/javaScript/musicas_js/Musica_menu_registro.js"></script>
  <main class="escena">
    <form class="tarjeta" autocomplete="off">

      <!-- Panel de madera -->
      <div class="panel-wrap">
        <img src="../../../../PanasRPG/imagenes/Menus/inicio/panel_login.png" alt="FatRPG - Registrarse" class="panel-img">

        <div class="campo campo--usuario">
          <input type="text" id="usuario" name="usuario" placeholder="Usuario" required>
        </div>

        <div class="campo campo--password">
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        
      </div>

      <!-- Botón de registro -->
      <button type="submit" class="btn-registrarse">
        <img src="../../../../PanasRPG/imagenes/Menus/inicio/boton_login.png" alt="Registrarse">
      </button>

      <!-- Cartel "¿Ya tienes una cuenta?" -->
      <a href="../Registro\registro.html" class="link-login">
        <img src="../../../../PanasRPG/imagenes/Menus/inicio/notienesunacuenta.png" alt="¿Ya tienes una cuenta? Inicia sesión.">
      </a>
    </form>
  </main>

</body>
</html>
