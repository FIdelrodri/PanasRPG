<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanasRPG — Menú principal</title>
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="Main_game.css">
</head>
<body class="vista-menu">

  <!-- ===== Cuenta ===== -->
  <header class="cuenta">
    <div class="insignia" role="img" aria-label="Nivel">
      <span class="insignia__rotulo">Nivel</span>
      <span class="insignia__numero" id="cuenta-nivel">–</span>
    </div>

    <div class="cuenta__datos">
      <p class="cuenta__nombre" id="cuenta-nombre">Cargando…</p>
      <div class="xp" id="xp" role="progressbar" aria-label="Experiencia hasta el próximo nivel"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="xp__relleno" id="xp-relleno"></div>
      </div>
      <p class="xp__texto" id="xp-texto"></p>
      <p class="cuenta__oro" id="cuenta-oro"></p>
    </div>

    <button type="button" class="boton boton--sutil" id="btn-logout">Cerrar sesión</button>
  </header>

  <main class="menu" id="contenido">

    <!-- ===== Equipo ===== -->
    <section class="panel seccion seccion--equipo" data-seccion="equipo" aria-labelledby="t-equipo">
      <div class="panel__cabecera">
        <h2 class="panel__titulo" id="t-equipo">Equipo</h2>
        <p class="panel__nota">Para la próxima batalla</p>
      </div>
      <div class="panel__cuerpo" id="equipo"><p class="vacio">Cargando…</p></div>
    </section>

    <!-- ===== Inventario ===== -->
    <section class="panel seccion seccion--inventario" data-seccion="inventario" aria-labelledby="t-inventario">
      <div class="panel__cabecera">
        <h2 class="panel__titulo" id="t-inventario">Inventario</h2>
        <label class="orden">
          <span class="orden__texto">Ordenar por</span>
          <select id="inv-orden">
            <option value="categoria">Categoría</option>
            <option value="nombre">Nombre</option>
            <option value="cantidad">Cantidad</option>
          </select>
        </label>
      </div>
      <div class="filtros" id="inv-filtros" role="group" aria-label="Filtrar por categoría"></div>
      <div class="lista-scroll lista-scroll--inventario" id="inventario"><p class="vacio">Cargando…</p></div>
    </section>

    <!-- ===== Combate: Mundos, Bosses, Mercado, Crafteo ===== -->
    <section class="panel seccion seccion--combate" data-seccion="combate" aria-labelledby="t-combate">
      <div class="panel__cabecera">
        <h2 class="panel__titulo" id="t-combate">Combate</h2>
      </div>

      <div class="pestanas" role="tablist" aria-label="Secciones de combate">
        <button type="button" class="pestana" role="tab" id="tab-mundos" data-tab="mundos"
                aria-selected="true" aria-controls="panel-mundos">Mundos</button>
        <button type="button" class="pestana" role="tab" id="tab-bosses" data-tab="bosses"
                aria-selected="false" aria-controls="panel-bosses">Bosses</button>
        <button type="button" class="pestana" role="tab" id="tab-mercado" data-tab="mercado"
                aria-selected="false" aria-controls="panel-mercado">Mercado</button>
        <button type="button" class="pestana" role="tab" id="tab-crafteo" data-tab="crafteo"
                aria-selected="false" aria-controls="panel-crafteo">Crafteo</button>
      </div>

      <div id="panel-mundos" role="tabpanel" aria-labelledby="tab-mundos">
        <div class="filtros" id="mundos" role="group" aria-label="Elegir mundo"></div>
        <div class="lista-scroll lista-scroll--combate" id="enemigos"><p class="vacio">Cargando…</p></div>
      </div>

      <div id="panel-bosses" role="tabpanel" aria-labelledby="tab-bosses" hidden>
        <div class="lista-scroll lista-scroll--combate" id="bosses"><p class="vacio">Cargando…</p></div>
      </div>

      <div id="panel-mercado" role="tabpanel" aria-labelledby="tab-mercado" hidden>
        <div class="mercado__cabecera">
          <p class="panel__nota">10 objetos por rotación. Comprá con oro o renová todo el mercado.</p>
          <button type="button" class="boton" id="mercado-renovar">Renovar por 50 oro</button>
        </div>
        <div class="mercado" id="mercado"><p class="vacio">Cargando mercado…</p></div>
      </div>

      <div id="panel-crafteo" role="tabpanel" aria-labelledby="tab-crafteo" hidden>
        <label class="buscador" for="crafteo-busqueda">
          <span class="buscador__icono" aria-hidden="true">⌕</span>
          <span class="sr-only">Buscar recetas</span>
          <input id="crafteo-busqueda" type="search" placeholder="Buscar recetas por nombre">
        </label>
        <div class="lista-scroll lista-scroll--crafteo" id="crafteo"><p class="vacio">Cargando recetas…</p></div>
      </div>
    </section>

  </main>

  <!-- Navegación inferior (solo en pantallas chicas) -->
  <nav class="nav-movil" aria-label="Secciones del menú">
    <button type="button" class="nav-movil__boton" data-ir="combate">Combate</button>
    <button type="button" class="nav-movil__boton" data-ir="equipo">Equipo</button>
    <button type="button" class="nav-movil__boton" data-ir="inventario">Inventario</button>
  </nav>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="../../javaScript/sesion.js"></script>
  <script src="../../javaScript/menu.js"></script>
</body>
</html>
