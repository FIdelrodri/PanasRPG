<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanasRPG — Batalla</title>
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="Main_batalla.css">
</head>
<body class="vista-batalla">

  <header class="encabezado">
    <button type="button" class="boton boton--sutil" id="btn-volver">Volver al menú</button>
    <div class="encabezado__titulos">
      <p class="encabezado__tipo" id="bt-tipo"></p>
      <h1 class="encabezado__titulo" id="bt-titulo">Preparando la batalla…</h1>
    </div>
    <button type="button" class="boton boton--sutil" id="btn-logout">Cerrar sesión</button>
  </header>

  <main class="datos" id="datos" aria-live="polite"></main>

  <section class="crudo">
    <details>
      <summary>Ver los datos tal como llegan (JSON)</summary>
      <pre id="crudo"></pre>
    </details>
  </section>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="../../javaScript/sesion.js"></script>
  <script src="../../javaScript/batalla.js"></script>
</body>
</html>
